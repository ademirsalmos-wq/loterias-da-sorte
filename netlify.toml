# Sem build: o site é estático e publicado direto da raiz.
[build]
  publish = "."
  command = ""

# ---------------------------------------------------------------------
# NÃO existe mais Edge Function aqui, e isso é de propósito.
#
# Houve uma tentativa de usar uma Edge Function como ponte para a API da
# Caixa, partindo da suposição de que a API não enviava CORS. A suposição
# era falsa: ela envia CORS normalmente. O que a Caixa faz é GEOBLOQUEIO
# por IP — só aceita faixas brasileiras (LACNIC/NICBR).
#
# Resultado: os servidores do Netlify, fora do Brasil, levavam 403. O
# proxy não só era desnecessário como piorava as coisas, tirando a
# requisição do navegador do usuário (IP brasileiro, aceito) e jogando
# num servidor estrangeiro (recusado).
#
# Hoje o navegador chama a Caixa direto. Este arquivo só publica arquivos
# estáticos, e é tudo de que o sistema precisa daqui.
# ---------------------------------------------------------------------

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"

# Os módulos JS precisam do MIME correto para o navegador aceitá-los.
[[headers]]
  for = "/js/*.js"
  [headers.values]
    Content-Type = "text/javascript; charset=utf-8"

# ---------------------------------------------------------------------
# PWA
#
# O service worker NUNCA pode ser servido de cache: se o navegador guardar
# uma versão antiga dele, o usuário fica preso no app velho e nenhuma
# publicação chega até ele. Este cabeçalho é o que garante que uma versão
# nova sempre seja percebida.
# ---------------------------------------------------------------------
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "text/javascript; charset=utf-8"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/icones/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# ---------------------------------------------------------------------
# Os testes vão para o repositório (é onde eles servem para alguma coisa)
# mas não precisam ser servidos como site. Estes cabeçalhos evitam que
# mecanismos de busca os indexem; o Netlify publica a pasta inteira e não
# há como excluí-los da publicação sem um passo de build, que este projeto
# não tem — e não vale criar um só por isso.
# ---------------------------------------------------------------------
[[headers]]
  for = "/testes/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
