# Sem build: o site é estático e publicado direto da raiz.
[build]
  publish = "."
  command = ""

# ---------------------------------------------------------------------
# NÃO existe mais Edge Function aqui, e isso é de propósito.
#
# Houve uma tentativa de usar uma Edge Function como ponte para a API da
# Caixa, partindo da suposição de que a API não enviava CORS. A suposição
# era falsa: ela envia CORS normalmente. O que a Caixa faz é GEOBLOQUEIO
# por IP — só aceita faixas brasileiras (LACNIC/NICBR).
#
# Resultado: os servidores do Netlify, fora do Brasil, levavam 403. O
# proxy não só era desnecessário como piorava as coisas, tirando a
# requisição do navegador do usuário (IP brasileiro, aceito) e jogando
# num servidor estrangeiro (recusado).
#
# Hoje o navegador chama a Caixa direto. Este arquivo só publica arquivos
# estáticos, e é tudo de que o sistema precisa daqui.
# ---------------------------------------------------------------------

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"

# Os módulos JS precisam do MIME correto para o navegador aceitá-los.
[[headers]]
  for = "/js/*.js"
  [headers.values]
    Content-Type = "text/javascript; charset=utf-8"
